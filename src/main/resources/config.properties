# ===================================================================
# Aviation Calculation Parameters and Alert Thresholds
# ===================================================================

# ICAO Standard Jet-A CO2 Emission Factor (kg CO2 per kg fuel burned)
aviation.co2.factor=3.16

# Engine Vibration Thresholds (in mils pk-pk)
vibration.normal.max=2.5
vibration.caution.threshold=2.5
vibration.critical.threshold=4.0

# Fleet Efficiency Grading Thresholds (SFC in kg_fuel / (kg_payload * km))
grading.sfc.gradeA.max=0.000038
grading.sfc.gradeB.max=0.000048
grading.sfc.outlier.deviationPercent=25.0

# Multithreaded Telemetry Engine Settings
telemetry.threadpool.size=4
telemetry.simulation.batchDelayMs=150
